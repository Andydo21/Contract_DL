<!doctype html><meta charset="utf-8"><title>Gán nhãn text ↔ ảnh</title>
<style>body{font:15px system-ui;max-width:1100px;margin:24px auto;background:#f6f6f6;color:#222}button,input,select{padding:8px;margin:4px}#stage{position:relative;width:70%;display:inline-block;vertical-align:top}#image{width:100%;display:block}#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}aside{width:28%;display:inline-block;vertical-align:top}#text{white-space:pre-wrap;max-height:300px;overflow:auto}rect{fill:transparent;stroke:#00706b;stroke-width:3}#status{white-space:pre-wrap}</style>
<h1>Đoạn này có mô tả vùng ảnh này không?</h1>
<p>Mở pages.jsonl và chọn thư mục images đã xuất. Chọn đoạn chữ, vẽ vùng ảnh nếu còn thiếu, rồi đánh nhãn đúng hoặc không liên quan. Các cặp chưa xác nhận giữ trạng thái chưa gán nhãn.</p>
<input id="data" type="file" accept=".jsonl"><input id="files" type="file" webkitdirectory multiple><input id="reviewer" placeholder="Tên người xác nhận">
<button id="prev">Trang trước</button><button id="next">Trang sau</button><button id="save">Lưu pages-reviewed.jsonl</button>
<p id="status"></p><div id="stage"><img id="image"><svg id="overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg></div>
<aside><label>Đoạn text<select id="blocks"></select></label><div id="text"></div><label>Vùng ảnh<select id="regions"></select></label><p>Kéo trên trang để thêm vùng ảnh.</p><button id="yes">Có mô tả</button><button id="no">Không liên quan</button><button id="clear">Bỏ nhãn cặp này</button><p id="pair"></p></aside>
<script>
let pages=[],position=0,images=new Map(),start;
const el=id=>document.getElementById(id),current=()=>pages[position];
function draw(){const p=current();if(!p)return;el('status').textContent=`${p.document_id} · trang ${p.page_number} · ${p.pairs.filter(x=>x.label!==null).length}/${p.pairs.length} cặp đã xác nhận`;el('image').src=images.get(p.image.split('/').pop())||'';for(const name of ['blocks','regions']){el(name).replaceChildren();for(const b of p[name]){const option=document.createElement('option');option.value=b.id;option.textContent=name==='blocks'?b.text.slice(0,80):b.id;el(name).append(option)}}update();}
function update(){const p=current();if(!p)return;const b=p.blocks.find(x=>x.id===el('blocks').value),r=p.regions.find(x=>x.id===el('regions').value);el('text').textContent=b?.text||'';el('overlay').replaceChildren();if(r){const box=document.createElementNS('http://www.w3.org/2000/svg','rect');for(const [k,v] of Object.entries({x:r.bbox[0],y:r.bbox[1],width:r.bbox[2]-r.bbox[0],height:r.bbox[3]-r.bbox[1]}))box.setAttribute(k,v);el('overlay').append(box)}const pair=p.pairs.find(x=>x.text_id===b?.id&&x.region_id===r?.id);el('pair').textContent=pair?.label===1?'Đã xác nhận: có mô tả':pair?.label===0?'Đã xác nhận: không liên quan':'Chưa gán nhãn';}
el('data').onchange=async e=>{try{pages=(await e.target.files[0].text()).split(/\r?\n/).filter(x=>x.trim()).map(JSON.parse);position=0;draw()}catch(err){el('status').textContent=String(err)}};
el('files').onchange=e=>{for(const file of e.target.files)images.set(file.name,URL.createObjectURL(file));draw()};
el('blocks').onchange=el('regions').onchange=update;
el('prev').onclick=()=>{position=Math.max(0,position-1);draw()};el('next').onclick=()=>{position=Math.min(pages.length-1,position+1);draw()};
function point(e){const r=el('overlay').getBoundingClientRect();return [Math.max(0,Math.min(1000,(e.clientX-r.left)/r.width*1000)),Math.max(0,Math.min(1000,(e.clientY-r.top)/r.height*1000))]}
el('overlay').onpointerdown=e=>{start=point(e);el('overlay').setPointerCapture(e.pointerId)};
el('overlay').onpointerup=e=>{if(!start||!current())return;const end=point(e),bbox=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])];start=null;if(bbox[2]-bbox[0]<5||bbox[3]-bbox[1]<5)return;const p=current(),id='manual-figure:'+Date.now();p.regions.push({id,bbox,origin:'human_region'});for(const b of p.blocks)p.pairs.push({text_id:b.id,region_id:id,label:null,reviewer:''});draw();el('regions').value=id;update()};
function label(value){const p=current(),name=el('reviewer').value.trim();if(!p||!el('blocks').value||!el('regions').value)return;if(value!==null&&!name){alert('Nhập tên người xác nhận');return}let pair=p.pairs.find(x=>x.text_id===el('blocks').value&&x.region_id===el('regions').value);if(!pair){pair={text_id:el('blocks').value,region_id:el('regions').value};p.pairs.push(pair)}pair.label=value;pair.reviewer=value===null?'':name;pair.reviewed_at=value===null?null:new Date().toISOString();update()}
el('yes').onclick=()=>label(1);el('no').onclick=()=>label(0);el('clear').onclick=()=>label(null);
el('save').onclick=()=>{const url=URL.createObjectURL(new Blob([pages.map(x=>JSON.stringify(x)).join('\n')+'\n'],{type:'application/jsonl'}));const link=document.createElement('a');link.href=url;link.download='pages-reviewed.jsonl';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script>
