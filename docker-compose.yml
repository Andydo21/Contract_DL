services:
  #   db:
  #     image: postgres:15-alpine
  #     container_name: riskdl_postgres
  #     restart: always
  #     environment:
  #       POSTGRES_DB: postgres
  #       POSTGRES_USER: postgres
  #       POSTGRES_PASSWORD: postgrespassword
  #     ports:
  #       - "5432:5432"
  #     volumes:
  #       - pgdata:/var/lib/postgresql/data
  #       - ./db-init:/docker-entrypoint-initdb.d

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riskdl_web
    restart: always
    environment:
      - DB_NAME=contract_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
      - AI_SERVICE_URL=http://ai-service:8000
      - BLOCKCHAIN_SERVICE_URL=http://blockchain-service:8000
      - WORKFLOW_SERVICE_URL=http://workflow-service:8000

    volumes:
      - .:/app

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: riskdl_ai
    restart: always
    environment:
      - KAGGLE_AI_URL=https://rummage-triangle-figurine.ngrok-free.dev
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./ai_service:/app

  blockchain-service:
    build:
      context: ./blockchain_service
      dockerfile: Dockerfile
    container_name: blockchain_service
    restart: always
    environment:
      - DB_NAME=blockchain_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
    volumes:
      - ./blockchain_service:/app

  workflow-service:
    build:
      context: ./workflow_service
      dockerfile: Dockerfile
    container_name: workflow_service
    restart: always
    environment:
      - DB_NAME=workflow_db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SSLMODE=${DB_SSLMODE}
    volumes:
      - ./workflow_service:/app

  gateway:
    image: nginx:alpine
    container_name: riskdl_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - ai-service
      - blockchain-service
      - workflow-service

volumes:
  pgdata:
