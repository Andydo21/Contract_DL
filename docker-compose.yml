# Contract Guard AI - toàn bộ hệ thống trong một file. Bật tất cả: .\run-all.bat
# Tên project cố định để luôn dùng lại các volume dữ liệu hiện có (contract_dl_*).
name: contract_dl

x-django-db: &django-db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_SSLMODE: disable

services:
  # ---------------------------------------------------------------- dữ liệu
  postgres:
    image: postgres:15-alpine
    container_name: contract_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contract_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - contract-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - riskdl-net

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: contract_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - ./runtime/qdrant:/qdrant/storage
    networks:
      - riskdl-net

  # Đồ thị tri thức; dữ liệu trong runtime/neo4j của dự án.
  neo4j:
    image: neo4j:5-community
    container_name: contract_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    volumes:
      - ./runtime/neo4j/data:/data
      - ./runtime/neo4j/logs:/logs
    networks:
      - riskdl-net

  # ---------------------------------------------------------------- ứng dụng (cùng image riskdl-web-local)
  web:
    image: riskdl-web-local:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web-local
    container_name: riskdl_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000 --noreload
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *django-db
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME:-contract_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8000
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_ROLE: web
      RAG_INFERENCE_URL: ${A3_INFERENCE_URL:-http://host.docker.internal:8010}
      A3_ENTITY_PROVIDER: gliner
      # Unified Kaggle/ngrok endpoint: summarize + entities + clauses.
      KAGGLE_QWEN_SERVICE_URL: ${KAGGLE_QWEN_SERVICE_URL}
      COLPALI_BASE_URL: ${COLPALI_BASE_URL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      QWEN_MODEL_ID: ${QWEN_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_URI: ${NEO4J_DOCKER_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
    networks:
      - riskdl-net

  # Gọi mô hình (Qwen), tìm kiếm tri thức, job trích xuất / phân tích rủi ro; web chuyển việc sang đây (AI_SERVICE_URL).
  ai:
    image: riskdl-web-local:latest
    container_name: riskdl_ai
    restart: unless-stopped
    working_dir: /app
    command: python manage.py run_ai_service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *django-db
      AI_SERVICE_ROLE: ai
      A3_ENTITY_PROVIDER: gliner
      RAG_INFERENCE_URL: ${A3_INFERENCE_URL:-http://host.docker.internal:8010}
      NEO4J_URI: ${NEO4J_DOCKER_URI:-}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    volumes:
      - .:/app
    networks:
      - riskdl-net

  workflow-service:
    image: riskdl-web-local:latest
    container_name: workflow_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *django-db
      SECRET_KEY: ${SECRET_KEY}
      WORKFLOW_SERVICE_TOKEN: ${WORKFLOW_SERVICE_TOKEN}
      DB_NAME: ${WORKFLOW_DB_NAME:-workflow_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAGGLE_AI_URL: ${KAGGLE_AI_URL}
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./workflow_service:/app
      - ./shared:/app/shared
      - ./frontend:/app/frontend:ro
    networks:
      - riskdl-net

  # Sổ giao dịch: web ghi thao tác lên Fabric (ledger_service.py) và lưu ở đây những gì Fabric đã xác nhận
  # (bằng chứng hash, giao dịch, kiểm toán, chứng chỉ, chữ ký, kiểm chứng).
  blockchain-service:
    image: riskdl-web-local:latest
    container_name: blockchain_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *django-db
      SECRET_KEY: ${SECRET_KEY}
      FABRIC_GATEWAY_URL: http://fabric-gateway:5000
      LEDGER_BOOK_TOKEN: ${LEDGER_BOOK_TOKEN}
      DB_NAME: ${BLOCKCHAIN_DB_NAME:-blockchain_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./blockchain_service:/app
      - ./shared:/app/shared
    networks:
      - riskdl-net

  ledger-worker:
    image: riskdl-web-local:latest
    container_name: contract_ledger_worker
    restart: unless-stopped
    working_dir: /app
    command: python manage.py ledger_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *django-db
      # .env trỏ tới cổng trên máy để chạy ngoài Docker; trong Docker gọi theo tên dịch vụ.
      BLOCKCHAIN_SERVICE_URL: http://blockchain-service:8000
    volumes:
      - .:/app
    networks:
      - riskdl-net

  # ---------------------------------------------------------------- Hyperledger Fabric 2.5
  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: contract_orderer
    restart: unless-stopped
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      - ORDERER_ADMIN_TLS_CERTIFICATE=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTPRIVATEKEY=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      - ORDERER_ADMIN_TLS_CLIENTCERTIFICATE=/fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
    volumes:
      - ./blockchain/fabric:/fabric
      - contract-orderer-ledger:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "7053:7053"
    networks:
      - riskdl-net

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5
    container_name: contract_peer
    restart: unless-stopped
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=riskdl-net
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./blockchain/fabric:/fabric
      - contract-peer-ledger:/var/hyperledger/production
    ports:
      - "7051:7051"
    networks:
      - riskdl-net

  fabric-chaincode:
    # Biên dịch sẵn trong image; sửa file .go thì: docker compose build fabric-chaincode
    build: ./blockchain/fabric/chaincode
    image: contract-chaincode-local:latest
    container_name: contract_chaincode
    restart: unless-stopped
    environment:
      CHAINCODE_SERVER_ADDRESS: 0.0.0.0:9999
      ENTERPRISE_GATEWAY_CERT_PATH: /gateway-cert.pem
    volumes:
      - ./blockchain/fabric/chaincode:/chaincode:ro   # chỉ để đọc package_id.txt do fabric-cli ghi
      - ./blockchain/fabric/crypto-config/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp/signcerts/User1@org1.example.com-cert.pem:/gateway-cert.pem:ro
    networks:
      - riskdl-net

  fabric-gateway:
    # Thư viện cài sẵn trong image; server.js gắn từ ngoài nên sửa xong chỉ cần restart.
    build: ./blockchain/fabric/gateway
    image: contract-fabric-gateway-local:latest
    container_name: contract_fabric_gateway
    restart: unless-stopped
    volumes:
      - ./blockchain/fabric/crypto-config:/opt/crypto-config:ro
      - ./blockchain/fabric/gateway/server.js:/opt/gateway/server.js:ro
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PEER_ENDPOINT=peer0.org1.example.com:7051
      - CHANNEL_NAME=contracts-channel
      - CHAINCODE_NAME=ContractVerifyChaincode
      - FABRIC_GATEWAY_TOKEN=${FABRIC_GATEWAY_TOKEN}
    depends_on:
      - fabric-chaincode
    networks:
      - riskdl-net

  # Chỉ dùng một lần khi dựng mạng Fabric mới (tạo crypto, kênh):
  #   docker compose --profile fabric-bootstrap run --rm fabric-init
  #   docker compose up -d orderer.example.com peer0.org1.example.com
  #   docker compose --profile fabric-bootstrap run --rm fabric-cli
  fabric-init:
    profiles: [fabric-bootstrap]
    image: hyperledger/fabric-tools:2.5
    container_name: contract_fabric_init
    volumes:
      - ./blockchain/fabric:/fabric
    entrypoint: /bin/bash /fabric/bootstrap-init.sh
    networks:
      - riskdl-net

  fabric-cli:
    profiles: [fabric-bootstrap]
    image: hyperledger/fabric-tools:2.5
    container_name: contract_fabric_cli
    volumes:
      - ./blockchain/fabric:/fabric
    entrypoint: /bin/bash /fabric/bootstrap-channel.sh
    networks:
      - riskdl-net

  # Tuỳ chọn: chạy GPU runtime trong Docker thay cho start-a3-inference.ps1 trên Windows.
  #   docker compose --profile linux-runtime up -d a3-inference
  a3-inference:
    profiles: [linux-runtime]
    image: riskdl-web-local:latest
    container_name: contract_a3_inference
    restart: unless-stopped
    gpus: all
    working_dir: /app
    command: sh /app/ai/evaluation/start_a3_linux_runtime.sh
    environment:
      HF_HOME: /model-cache
      HF_HUB_CACHE: /model-cache/hub
      HUGGINGFACE_HUB_CACHE: /model-cache/hub
      BGE_LOCAL_CACHE: /model-cache/hub
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RAG_TEXT_DEVICE: cuda
      RAG_STREAM_CHECKPOINTS: '1'
      RAG_IDLE_UNLOAD_SECONDS: '120'
      GLINER_MODEL_PATH: /models/a3/gliner-relex-multi-v1.0
      GLINER_ENCODER_CACHE: /models/a3/gliner-encoder-cache
      GLINER2_MODEL_PATH: /models/a3/gliner2-base-v1
      NLI_MODEL_PATH: /models/a3/nli-deberta-v3-xsmall
      BGE_MODEL_PATH: /models/a3/bge-m3
      TABLE_COLUMN_MODEL_PATH: /models/a3/table-transformer
      QWEN_TOKENIZER_PATH: /models/a3/qwen-tokenizer
      A3_LLAMA_DIR: /models/a3/llama-linux-cuda128
      SURYA_INFERENCE_BACKEND: llamacpp
      SURYA_GGUF_LOCAL_MODEL_PATH: /models/a3/surya/surya-2.gguf
      SURYA_GGUF_LOCAL_MMPROJ_PATH: /models/a3/surya/surya-2-mmproj.gguf
      SURYA_INFERENCE_PARALLEL: '2'
      SURYA_INFERENCE_CTX_SIZE: '32768'
      SURYA_INFERENCE_KEEP_ALIVE: 'True'
      SURYA_INFERENCE_AUTOSTART: 'False'
      SURYA_INFERENCE_URL: http://127.0.0.1:8011/v1
      SURYA_MANAGED_BACKEND: '1'
      SURYA_EXCLUSIVE_GPU: '1'
      SURYA_PAGE_GENERATION_TIMEOUT: '0'
      SURYA_REQUEST_GENERATION_TIMEOUT: '0'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      A3_DOCKER_LOG_CONTAINER: ''
    volumes:
      - .:/app
      - ./runtime/hf_cache:/model-cache
      - ./runtime/models:/models/a3
    healthcheck:
      test: ['CMD', '/app/runtime/linux-env/bin/python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/rag/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s
    networks:
      - riskdl-net

networks:
  riskdl-net:
    name: riskdl-net

volumes:
  contract-postgres-data:
  contract-orderer-ledger:
  contract-peer-ledger:
